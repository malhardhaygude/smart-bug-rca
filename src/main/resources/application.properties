spring.application.name=smart-bug-analysis-rca-resolution

# PostgreSQL config
#spring.datasource.url=jdbc:postgresql://localhost:5432/rcadb
#spring.datasource.username=postgres
#spring.datasource.password=YOUR_DB_PASSWORD
#spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Database config
spring.datasource.url=jdbc:h2:mem:rcadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server port (optional, default is 8080)
server.port=8080

# LLM RCA Prompt
llm.rca.prompt=You are an experienced Java Backend and Full stack engineer(Angular Js).\n\
Analyze the incident and provide:\n\
1. Root cause\n\
2. Impact\n\
3. Resolution steps\n\n\
Incident Description: %s\n\
Severity: %s\n\
Environment: %s\n\
Symptoms: %s

